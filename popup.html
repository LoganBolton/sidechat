<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      color: #1a1a1a;
      background: #fff;
      padding: 16px;
    }
    h1 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 11px;
      color: #666;
      margin-bottom: 16px;
      line-height: 1.4;
    }
    label {
      display: block;
      font-weight: 500;
      margin-bottom: 4px;
      font-size: 12px;
    }
    .field {
      margin-bottom: 14px;
    }
    .api-key-wrapper {
      display: flex;
      gap: 6px;
    }
    .api-key-wrapper input {
      flex: 1;
    }
    input[type="password"],
    input[type="text"],
    select,
    input[type="range"] {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #d0d0d0;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      background: #fafafa;
    }
    input:focus, select:focus {
      border-color: #c97a3a;
      box-shadow: 0 0 0 2px rgba(201, 122, 58, 0.15);
    }
    select {
      cursor: pointer;
    }
    .toggle-btn {
      padding: 6px 10px;
      border: 1px solid #d0d0d0;
      border-radius: 6px;
      background: #fafafa;
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
    }
    .toggle-btn:hover {
      background: #f0f0f0;
    }
    .range-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .range-wrapper input[type="range"] {
      flex: 1;
      padding: 0;
    }
    .range-value {
      font-size: 12px;
      font-weight: 500;
      min-width: 36px;
      text-align: right;
      color: #555;
    }
    button.save {
      width: 100%;
      padding: 8px;
      background: #c97a3a;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    button.save:hover {
      background: #b56a2e;
    }
    .status {
      text-align: center;
      margin-top: 8px;
      font-size: 12px;
      color: #2e7d32;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <h1>Sidechat</h1>
  <p class="subtitle">Configure your settings. Your API key is stored locally in Chrome's sync storage.</p>

  <div class="field">
    <label for="apiKey">Anthropic API Key</label>
    <div class="api-key-wrapper">
      <input type="password" id="apiKey" placeholder="sk-ant-...">
      <button class="toggle-btn" id="toggleKey">Show</button>
    </div>
  </div>

  <div class="field">
    <label for="model">Model</label>
    <select id="model">
      <option value="claude-sonnet-4-20250514">Claude Sonnet 4</option>
      <option value="claude-haiku-4-5-20251001">Claude Haiku 4.5</option>
      <option value="claude-opus-4-6">Claude Opus 4.6</option>
    </select>
  </div>

  <div class="field">
    <label for="maxTokens">Max Tokens</label>
    <div class="range-wrapper">
      <input type="range" id="maxTokens" min="256" max="8192" step="256" value="4096">
      <span class="range-value" id="maxTokensValue">4096</span>
    </div>
  </div>

  <button class="save" id="saveBtn">Save Settings</button>
  <div class="status" id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
